<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Jesus in Practice sign-in code</title>
  </head>
  <body style="margin: 0; padding: 24px 12px; background: #faf7f0; color: #292522">
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td align="center">
          <table
            role="presentation"
            style="
              width: 100%;
              max-width: 580px;
              border-collapse: collapse;
              background: #fffdfa;
              border-top: 4px solid #6b303d;
            "
          >
            <tr>
              <td style="padding: 32px 24px; font-family: Arial, sans-serif; line-height: 1.6">
                <p style="margin: 0 0 24px; color: #6b303d; font-weight: bold">Jesus in Practice</p>
                <h1
                  style="
                    margin: 0 0 16px;
                    font-family: Georgia, serif;
                    font-size: 28px;
                    line-height: 1.3;
                    font-weight: normal;
                  "
                >
                  Your sign-in code
                </h1>
                <p style="margin: 0 0 20px; font-size: 16px">
                  Enter this code in the Jesus in Practice tab where you requested it.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 16px;
                    background: #faf7f0;
                    color: #6b303d;
                    font-family: monospace;
                    font-size: 28px;
                    font-weight: bold;
                    letter-spacing: 2px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 16px; font-size: 16px">
                  Keep this code private. If you did not request it, you can ignore this email.
                </p>
                <p style="margin: 0; font-size: 14px; color: #6a6057">
                  Need help? Open the Help page in the application to find your operator's support
                  contact.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
