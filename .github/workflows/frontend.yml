name: Application checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the complete public Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_DB: jip_integration_ci
          POSTGRES_USER: jip_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jip_test_admin -d jip_integration_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: "10.26.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
        env:
          RUN_POSTGRES_INTEGRATION: "true"
          TEST_DATABASE_URL: postgresql://jip_test_admin:synthetic-ci-only-password@127.0.0.1:5432/jip_integration_ci
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_DB: jip_fixture
          POSTGRES_USER: jip_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U jip_test_admin -d jip_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.26.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/website audit --prod --audit-level=high
      - run: pnpm --dir apps/dashboard audit --prod --audit-level=high
      - run: pnpm --dir packages/backend audit --prod --audit-level=high
      - run: pnpm --dir apps/website audit --audit-level=high
      - run: pnpm --dir apps/dashboard audit --audit-level=high
      - run: pnpm --dir packages/backend audit --audit-level=high
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build isolated live-mode browser fixture
        run: pnpm --filter @jesus-in-practice/dashboard build
        env:
          NEXT_BUILD_DIR: .next-live
          NEXT_PUBLIC_APP_MODE: live
          SUPPORT_EMAIL: support@example.test
      - run: pnpm test:e2e:live
      - name: Check real HTTP routes and PostgreSQL together
        timeout-minutes: 5
        run: |
          pnpm test:db:prepare
          pnpm test:http:local
